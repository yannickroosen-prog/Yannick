# Netlify-configuratie voor de Warme Babbel-app (Next.js met server-side rendering).
#
# Deze map (warme-babbel/) is de "Base directory" van het Netlify-project.
# Zie docs/DEPLOYMENT.md voor de volledige stappen.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Officiële Next.js Runtime (SSR, middleware, route handlers, ISR).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers voor statische bestanden. Voor gerenderde pagina's zet next.config.ts dezelfde headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/embed.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=86400"
    Access-Control-Allow-Origin = "*"
