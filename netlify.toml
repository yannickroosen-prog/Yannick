# Netlify-configuratie voor de Next.js-app.
# De Next.js-runtime wordt automatisch gedetecteerd en verzorgt SSR/App Router.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Camera-toegang vereist een expliciete Permissions-Policy header.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self)"
