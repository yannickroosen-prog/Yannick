decisions:
  - "Sprongregel: geen terugkeer naar een dag die de graaf al beleefde."
  - "Kantelpunt 'Waarom komt ge zelf niet mee?' in hfst. 6 (~25%)."
  - "Tijdlijn: 1784 -> 1838 (Pym) -> mei 1884 -> december 1884 (procesverslag) -> 19 mei 1884 (kade) -> 1837 (Poe)."
  - "Geen prijs per sprong; geen verloren herinneringen."
  - "Lengte ~80.000 woorden (75.000-88.000), 22 hoofdstukken; Poe ~12%."
  - "Life of Pi: alleen korte erkenning in het nawoord."
  - "Auteur: werkveld [auteursnaam]."
  - "De wacht: 'Wilt ge dat ik blijf?' / 'Ge wilt dat ik zeg dat ge moogt gaan.'"
  - "Haven in één dag (19 mei 1884); voorstel, ter bevestiging (I-02)."
  - "46 jaar: de naam wordt een bijgeloof met knipsels; krantenbericht mei 1884 (verzonnen); voorstel, ter bevestiging (I-01)."
  - "Proefhoofdstuk 12 herzien na feedback auteur (sloep-zin, dankbaarheid, thee, kanttekeningen, zeshonderd jaar)."
  - "Brief-contractcheck: PASS; verificatie degraded (niet onafhankelijk)."
  - "I-01 en I-02 bevestigd; nieuwe openingszin van de auteur."
  - "Hfst. 13: Richard vult een kruik en verliest ze om Brooks te helpen."
  - "Hfst. 19: de knoop is geen toestemming en geen vergeving."
  - "Lengte (auteur): optie 3, richtpunt 65.000, vloer van 75.000 geschrapt; extra scènes alleen uit keuzes van personages, geen extra storm."
  - "Golfuur: tegen de avond van 5 juli (auteur, met bronnen); hfst. 3 aangepast."
  - "Hfst. 2 en 3 eindigen eerder (auteur)."
  - "Leespanel hfst. 1: vier geïsoleerde subagents, met drie extra vragen van de auteur."
  - "Hfst. 4: kanttekening over de tweede strofe geschrapt (auteur): de kruik blijft voor hfst. 13."
  - "Nawoord: 'De gesprekken aan boord zijn in Vlaamse spreektaal weergegeven.' (work/nawoord-notities.md)."
  - "Hfst. 12 vervangt de proefversie; opent met 'Stephens bakt'; het slot van hfst. 11 is de vinger op de naam."
  - "Lengte (auteur, na hfst. 14): korte roman, richtpunt ~50.000 woorden. Stilistische revisie pas na de volledige eerste versie (work/revisie-notities.md)."
  - "Hfst. 19 eindigt zodra de graaf vertrokken is; de vraag en het antwoord van de wacht horen bij Poe (hfst. 21)."
  - "Eerste versie: 35.421 woorden; de auteur leest haar op deze lengte en beoordeelt daarna of er in de sloep iets ontbreekt."
  - "Hfst. 22 eindigt op het doorgestreepte 'Dank u' (Unicode-doorhaling, zodat het ook in EPUB werkt)."
  - "Na lezing (auteur): geen extra sloepscène; hfst. 1 en de laatste regel blijven; nagaan of Richard aan het einde te vaak de graaf doorziet."
  - "T-04 gesloten als auteurskeuze; T-05 met de zin van de auteur in hfst. 2."
  - "Afwijking van de workflow op vraag van de auteur: proefhoofdstuk 12 vóór fase 2, als werkstuk (work/), niet canoniek; geen paneelronde."

